include: package:flutter_lints/flutter.yaml

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options

linter:
  rules:
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - prefer_final_in_for_each
    - avoid_print
    - unawaited_futures
    - always_declare_return_types
    - avoid_unused_constructor_parameters
    - use_super_parameters

analyzer:
  # Kept in sync with the flutter_tools analysis_options migration, which
  # otherwise rewrites this file during `flutter pub get` and leaves the tree
  # dirty enough to fail `pub publish --dry-run` in CI.
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  errors:
    # Treat these as info/ignore for existing codebase compatibility
    prefer_const_constructors: info
    prefer_single_quotes: ignore
    require_trailing_commas: ignore
