name: virtual_keypad
description: "On-screen virtual keyboard widget and keypad for Flutter kiosk, POS, TV, desktop and touchscreen apps. Numeric, numpad, PIN, emoji, floating and custom layouts in 12 languages."
version: 0.8.1
homepage: https://github.com/Masum-MSNR/virtual_keypad
repository: https://github.com/Masum-MSNR/virtual_keypad
issue_tracker: https://github.com/Masum-MSNR/virtual_keypad/issues

topics:
  - keyboard
  - virtual-keyboard
  - onscreen-keyboard
  - multilingual-keyboard
  - text-input

screenshots:
  - description: "Compact keyboard layout preview with emoji and search actions."
    path: previews/pubdev-sidebar.png
  - description: "Note editor workflow with emoji access and inline counters."
    path: previews/phone1.gif
  - description: "Themeable keyboard preview with custom visual presets."
    path: previews/phone2.gif
  - description: "Multilingual keyboard flow with live language switching."
    path: previews/phone3.gif
  - description: "Standalone integration with standard Flutter TextFields."
    path: previews/desktop1.gif
  - description: "Floating keyboard overlay with draggable toolbar controls."
    path: previews/desktop2.gif

environment:
  sdk: ^3.0.0
  flutter: ">=3.0.0"

dependencies:
  emoji_picker_flutter: ^4.4.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Noto Emoji, subset to the 1271 codepoints the emoji picker uses.
  # Flutter web downloads a fallback emoji font on demand, so without a bundled
  # font the emoji page renders blank on a first offline load. This font is only
  # applied on web; native platforms keep their own color emoji font.
  # Licensed under the SIL Open Font License 1.1, see fonts/OFL.txt.
  fonts:
    - family: NotoEmoji
      fonts:
        - asset: fonts/NotoEmoji-Regular.ttf

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

