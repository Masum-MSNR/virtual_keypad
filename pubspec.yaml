name: virtual_keypad
description: "A customizable Flutter virtual keyboard with standalone, scoped, and floating modes, emoji support, custom layouts, 12 languages, submit actions, and theming."
version: 0.8.0
homepage: https://github.com/Masum-MSNR/virtual_keypad
repository: https://github.com/Masum-MSNR/virtual_keypad
issue_tracker: https://github.com/Masum-MSNR/virtual_keypad/issues

topics:
  - keyboard
  - virtual-keyboard
  - onscreen-keyboard
  - multilingual-keyboard
  - flutter-keyboard

screenshots:
  - description: "On-screen keyboard demo with themed text input in a Flutter form."
    path: images/gif1.gif
  - description: "Numeric and action-key input flow for keypad-style Flutter screens."
    path: images/gif2.gif
  - description: "Multi-field virtual keyboard workflow across common Flutter input use cases."
    path: images/gif3.gif

environment:
  sdk: ^3.0.0
  flutter: ">=3.0.0"

dependencies:
  emoji_picker_flutter: ^4.4.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  assets:
    - images/logo.png

  # To add custom fonts to your package, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
