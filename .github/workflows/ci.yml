name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  analyze:
    name: Analyze, Test & Pub Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Install example dependencies
        working-directory: example
        run: flutter pub get

      - name: Analyze example app
        working-directory: example
        run: flutter analyze

      - name: Verify pub publish dry-run
        run: flutter pub publish --dry-run

      - name: Install screenshot tools
        run: |
          sudo apt-get update
          sudo apt-get install -y webp

      - name: Install pana
        run: dart pub global activate pana

      - name: Check pub points with pana
        run: |
          export PATH="$HOME/.pub-cache/bin:$PATH"
          FLUTTER_ROOT="$(dirname "$(dirname "$(which flutter)")")"
          DART_SDK="$FLUTTER_ROOT/bin/cache/dart-sdk"
          pana --flutter-sdk "$FLUTTER_ROOT" --dart-sdk "$DART_SDK" --exit-code-threshold 0 .