name: Release, Publish & Deploy

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

jobs:
  package-quality:
    name: Release Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Install example dependencies
        working-directory: example
        run: flutter pub get

      - name: Analyze example app
        working-directory: example
        run: flutter analyze

      - name: Verify pub publish dry-run
        run: flutter pub publish --dry-run

      - name: Install pana
        run: dart pub global activate pana

      - name: Check pub points with pana
        run: |
          export PATH="$HOME/.pub-cache/bin:$PATH"
          FLUTTER_ROOT="$(dirname "$(dirname "$(which flutter)")")"
          DART_SDK="$FLUTTER_ROOT/bin/cache/dart-sdk"
          pana --flutter-sdk "$FLUTTER_ROOT" --dart-sdk "$DART_SDK" --exit-code-threshold 0 .

  deploy-example:
    needs: package-quality
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build example web app
        working-directory: example
        run: |
          flutter pub get
          flutter build web --release --base-href /

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: my-pub-packages
          target: masum-vk

  # JOB 2: Create the tag (Runs only on branch push)
  create-tag:
    needs: package-quality
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_PAT }}
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create and Push Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          TAG="v${{ steps.version.outputs.version }}"
          
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists. Skipping."
          else
            git tag $TAG
            git push origin $TAG
          fi

  # JOB 3: Publish to Pub.dev (Runs only on tag push)
  publish:
    needs: package-quality
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Setup Pub Credentials
        uses: dart-lang/setup-dart@v1

      - name: Publish
        run: flutter pub publish --force